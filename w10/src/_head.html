<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{TITLE}}</title>
<meta name="description" content="EDUC1033 Week 10: health and safety education. How can education contribute to a healthier and safer society?">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400;1,6..72,500&family=Public+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#FFFFFF; --plate:#FFFFFF; --ink:#18221F; --ink2:#44514C; --rule:#D5DCD8;
  --panel:#EFF3F0; --accent:#22604A; --accent-d:#163F31; --tint:#DCEBE3; --sea:#D2E6DB;
  --rust:#8E3B5C; --rust-d:#6E2A45; --rust-t:#F4E2EA; --gold:#9A6512; --gold-t:#F5E8D0; --slate:#5A6B65; --slate-t:#E3E9E6;
  --on-dark:#C3DCD0; --on-dark2:#A6CDBC; --dark-rule:#2E5C4B; --pink-l:#E9A9C2; --pink-t:#F4E2EA;
  --serif:"Newsreader", Georgia, serif; --sans:"Public Sans", "Segoe UI", sans-serif;
  /* type scale for a 1280×720 slide projected in a lecture theatre */
  --t-title:42px; --t-lead:24.5px; --t-body:21.5px; --t-sub:19.5px; --t-note:17px; --t-src:15px;
}
*{box-sizing:border-box}
html,body{margin:0;background:#0E1714;color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
::selection{background:var(--accent);color:#fff}
a{color:inherit}
.deck{display:flex;flex-direction:column;align-items:center;gap:24px;padding:24px 0}
.present,.present body{height:100%;overflow:hidden}
.present .deck{display:block;padding:0;height:100%;position:relative}
.present .frame{display:none;position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);box-shadow:none}
.present .frame.cur{display:block;animation:fadein .28s cubic-bezier(.16,1,.3,1)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
.present.idle,.present.idle *{cursor:none!important}
.frame{width:calc(1280px*var(--s,1));height:calc(720px*var(--s,1));flex:none;box-shadow:0 6px 30px rgba(0,0,0,.35);overflow:hidden}
.slide{width:1280px;height:720px;transform:scale(var(--s,1));transform-origin:0 0;position:relative;overflow:hidden;
  background:var(--paper);padding:44px 60px 56px;display:flex;flex-direction:column}
.slide::after{content:attr(data-n);position:absolute;right:28px;bottom:18px;font:500 15px/1 var(--sans);color:var(--ink2);font-variant-numeric:tabular-nums}
.slide.dark::after{color:var(--on-dark2)}
/* navigation controller */
.nav{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:4px;opacity:0;transition:opacity .25s;z-index:20}
.navshow .nav,.nav:hover,.nav:focus-within{opacity:1}
.nav button{width:46px;height:40px;border:0;border-radius:3px;background:rgba(14,20,23,.86);color:#fff;display:grid;place-items:center;cursor:pointer;padding:0}
.nav button:hover{background:var(--accent)}
.nav button:focus-visible{outline:2px solid var(--on-dark2);outline-offset:2px}
.nav button:disabled{opacity:.35;cursor:default;background:rgba(14,20,23,.86)}
.nav svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .sp{min-width:86px;padding:0 12px;border-radius:3px;display:grid;place-items:center;background:rgba(14,20,23,.86);color:#C9D6DB;font:600 15px/1 var(--sans);font-variant-numeric:tabular-nums;letter-spacing:.04em}
.present.idle .nav:not(:hover){opacity:0}
.ov .deck{flex-direction:row;flex-wrap:wrap;justify-content:center;align-content:flex-start;gap:22px;padding:36px 28px 90px}
.ov .frame{cursor:pointer;box-shadow:0 0 0 1px #3A4A51}
.ov .frame:hover{box-shadow:0 0 0 2px var(--on-dark2)}
.ov .frame.cur{box-shadow:0 0 0 4px var(--pink-l)}
.hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);font:500 13px var(--sans);color:#E7EEF0;background:rgba(14,20,23,.82);padding:8px 14px;border-radius:4px;transition:opacity .6s;pointer-events:none;z-index:5;white-space:nowrap}
.hint.off{opacity:0}
/* speaker notes */
.notes{display:none}
#spk{position:fixed;left:0;right:0;top:0;max-height:34vh;overflow:auto;background:rgba(14,20,23,.94);color:#E7EEF0;font:17px/1.55 var(--sans);padding:16px 28px 18px;z-index:30;display:none;border-bottom:2px solid var(--rust)}
#spk.on{display:block}
#spk b{display:block;font:700 12px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--pink-l);margin-bottom:8px}
/* incremental reveal */
.js [data-s]{opacity:0;transition:opacity .5s cubic-bezier(.16,1,.3,1)}
.js [data-s].on{opacity:1}
@media print{
  @page{size:1280px 720px;margin:0}
  html,body{background:var(--paper)}
  .deck,.present .deck{display:block;padding:0;height:auto}
  .frame,.present .frame,.present .frame.cur{display:block!important;position:static;transform:none;animation:none;width:1280px;height:720px;box-shadow:none;break-after:page;page-break-after:always}
  .present,.present body{height:auto;overflow:visible}
  .slide{transform:none}
  .hint,.nav,#spk{display:none!important}
  .js [data-s]{opacity:1!important;transition:none}
}

/* ---------- type ---------- */
h1.t{font:600 var(--t-title)/1.12 var(--serif);letter-spacing:-.014em;margin:0 0 26px;text-wrap:balance;max-width:1140px;color:var(--ink)}
.lead{font-size:var(--t-lead);line-height:1.45;margin:0 0 26px;max-width:1120px;text-wrap:pretty}
.lead b{font-weight:650}
p{margin:0}
.lab{font:700 14px/1 var(--sans);letter-spacing:.11em;text-transform:uppercase;color:var(--accent)}
.src{position:absolute;left:60px;right:110px;bottom:18px;font-size:var(--t-src);line-height:1.35;color:var(--ink2)}
.cap{font-size:var(--t-note);line-height:1.4;color:var(--ink2);margin-top:10px}
.mt-auto{margin-top:auto}
.hd{font:600 24.5px/1.3 var(--serif);color:var(--accent-d);margin:0 0 12px}
.dense{font-size:var(--t-body);line-height:1.5;color:var(--ink2)}
.dense b{font-weight:650}
.small{font-size:var(--t-sub);line-height:1.45;color:var(--ink2)}
ul.b{margin:0;padding:0;list-style:none;font-size:var(--t-body)}
ul.b li{position:relative;padding-left:22px;margin:0 0 14px;line-height:1.45}
ul.b li::before{content:"";position:absolute;left:3px;top:.6em;width:7px;height:7px;border-radius:50%;background:var(--dot,var(--accent))}
ul.b li:last-child{margin-bottom:0}
ul.b b{font-weight:650;color:var(--ink)}

/* ---------- layout ---------- */
.row{display:flex;gap:40px}
.body{flex:1;min-height:0;display:flex;flex-direction:column}
/* figure + reading: figure sized to the space, reading centred beside it */
.fx{display:flex;gap:40px;flex:1;min-height:0;align-items:stretch}
.fx>.plate{flex:none}
.fx>.read{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center}
.cards3{display:grid;grid-template-columns:repeat(3,1fr);gap:28px}
.card{background:var(--panel);border-top:3px solid var(--accent);border-radius:0 0 4px 4px;padding:26px 28px 28px}
.card h2{font:650 25.5px/1.25 var(--sans);margin:0 0 12px;text-wrap:balance}
.card p,.card li{font-size:var(--t-body);line-height:1.5;color:var(--ink2)}
.card .small{font-size:var(--t-sub)}
.card.r{border-top-color:var(--rust)} .card.g{border-top-color:var(--gold)}
.grow{flex:1;min-height:0;margin-bottom:24px;align-items:start}
.num{font:600 34px/1 var(--serif);color:var(--accent)}
.band{background:var(--accent);color:#fff;font:600 22px/1.42 var(--sans);padding:18px 26px;border-radius:4px;text-wrap:pretty}
.note{background:var(--tint);border-radius:4px;padding:18px 22px;font-size:20.5px;line-height:1.48;color:var(--accent-d)}
.note b{font-weight:650}
.photo img{display:block;width:100%;object-fit:cover;border-radius:3px}
.plate{background:var(--plate);border-radius:4px;border:1px solid var(--rule);box-shadow:0 6px 20px rgba(24,34,31,.06);padding:12px}
.plate img{display:block;width:100%;height:100%;object-fit:contain}
.slide.ph::after{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.video{position:relative;display:block;width:900px;height:506px;margin:0 auto;border-radius:4px;overflow:hidden;cursor:pointer;background:#000}
.video img{width:100%;height:100%;object-fit:cover;display:block}
.video iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.video:hover .play{background:rgba(142,59,92,.92)}
.video:focus-visible{outline:3px solid var(--rust);outline-offset:3px}
.video .play{position:absolute;left:50%;top:50%;width:96px;height:96px;margin:-48px 0 0 -48px;border-radius:50%;background:rgba(22,63,49,.88);display:grid;place-items:center}
.vlink{margin-top:12px;font-size:17px;line-height:1.4;color:var(--ink2)}
.vlink a{color:var(--accent);text-underline-offset:3px}
.slide.dark{background:var(--accent-d);color:#F2F0EA}
.slide.dark .lab{color:var(--on-dark2)}
/* term / definition rows */
.rq{display:grid;grid-template-columns:220px 1fr;gap:24px;padding:16px 0;border-top:1px solid var(--rule);align-items:baseline}
.rq:last-child{border-bottom:1px solid var(--rule)}
.rq dt{font:650 21px/1.3 var(--sans);color:var(--accent-d)}
.rq dd{margin:0;font-size:var(--t-body);line-height:1.45;color:var(--ink2)}
.lg .rq{padding:20px 0}
.lg .rq dt{font-size:22.5px}
.lg .rq dd{font-size:22.5px}
/* data rows: a figure with its reading */
.fig-n{font:600 36px/1 var(--serif);color:var(--rust);font-variant-numeric:lining-nums}
.fig-n.ac{color:var(--accent)}
.dr{display:grid;grid-template-columns:136px 1fr;gap:18px;align-items:baseline;padding:15px 0;border-top:1px solid var(--rule)}
.dr.end{border-bottom:1px solid var(--rule)}
.dr p{font-size:21px;line-height:1.45;color:var(--ink2)}
.dr p b{color:var(--ink);font-weight:650}
/* simple bars */
.bars{display:grid;gap:11px}
.bar{display:grid;grid-template-columns:var(--lw,200px) 1fr 76px;align-items:center;gap:16px}
.bar .l{font-size:18px;line-height:1.2;text-align:right;color:var(--ink)}
.bar .tr{height:var(--bh,32px);background:var(--panel);border-radius:2px;position:relative}
.bar .f{position:absolute;left:0;top:0;bottom:0;border-radius:2px;background:var(--accent)}
.bar .f.r{background:var(--rust)} .bar .f.g{background:var(--gold)} .bar .f.s{background:#A9A396}
.bar .v{font:600 23px/1 var(--serif);font-variant-numeric:tabular-nums lining-nums}
/* tables */
table.tb{border-collapse:collapse;width:100%}
table.tb th{font:700 15px/1.2 var(--sans);letter-spacing:.09em;text-transform:uppercase;color:var(--ink2);text-align:left;padding:0 12px 11px;border-bottom:1.5px solid var(--ink);vertical-align:bottom}
table.tb td{font-size:21px;line-height:1.38;padding:12px;border-bottom:1px solid var(--rule);vertical-align:top;color:var(--ink2)}
table.tb td:first-child{font-weight:650;color:var(--ink)}
table.tb td.n{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
table.tb th.n{text-align:right}
/* activity slides */
.act{padding:72px 104px 76px}
.act .lab{font-size:17px}
.act .qs{margin:auto 0}
.act .q{font:500 41px/1.28 var(--serif);padding:30px 0;border-top:1px solid var(--dark-rule);text-wrap:pretty}
.act .q:first-child{border-top:0;padding-top:0}
.act .meta{font-size:20px;color:var(--on-dark2)}
/* section transition */
.part{padding:0;flex-direction:row}
.part .side{width:620px;background:var(--accent-d);color:#F2F0EA;padding:0 64px 0 76px;display:flex;flex-direction:column;justify-content:center}
.part h1{font:500 64px/1.05 var(--serif);letter-spacing:-.018em;margin:0 0 26px;text-wrap:balance}
.part .side p{font-size:23px;line-height:1.48;color:var(--on-dark);max-width:470px}
.part .pic{flex:1;background-size:cover;background-position:center;position:relative}
.credit{position:absolute;left:14px;bottom:12px;font-size:14px;color:#fff;background:rgba(14,20,23,.72);padding:3px 8px;border-radius:2px}
.part::after{color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.6)}
</style>
<style>
/* ---------- icons ---------- */
.disc{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--accent);flex:none}
.disc svg{width:26px;height:26px;display:block}
.disc.r{background:var(--rust)} .disc.g{background:var(--gold)} .disc.s{background:var(--slate)}
.disc.sm{width:44px;height:44px} .disc.sm svg{width:22px;height:22px}
.irow{display:grid;grid-template-columns:52px 1fr;gap:22px;align-items:center}
.ihd{display:flex;align-items:center;gap:14px;margin-bottom:14px}
.ihd h2,.ihd p{margin:0}
/* icon + term rows */
.rq.ic{grid-template-columns:56px 236px 1fr;align-items:center}
.rq.ic .disc{width:46px;height:46px}.rq.ic .disc svg{width:23px;height:23px}
/* ---------- charts with highlight overlays ---------- */
.chart{position:relative}
.chart img{display:block;width:100%;height:auto}
.hl{position:absolute;border:3px solid var(--rust);border-radius:5px;background:rgba(142,59,92,.06);box-shadow:0 0 0 2px rgba(255,255,255,.85)}
.hl .no{position:absolute;left:-17px;top:-17px;width:32px;height:32px;border-radius:50%;background:var(--rust);color:#fff;font:700 16px/32px var(--sans);text-align:center;box-shadow:0 0 0 2px #fff}
.hl.nr .no{left:auto;right:-17px}
.hl.ac{border-color:var(--accent);background:rgba(34,96,74,.06)} .hl.ac .no{background:var(--accent)}
/* key points beside a chart, keyed to the highlights */
.kp{display:grid;grid-template-columns:36px 1fr;gap:16px;align-items:start;padding:18px 0;border-top:1px solid var(--rule)}
.kp.end{border-bottom:1px solid var(--rule)}
.kp .m{width:32px;height:32px;border-radius:50%;background:var(--rust);color:#fff;font:700 16px/32px var(--sans);text-align:center;margin-top:1px}
.kp .m.ac{background:var(--accent)}
.kp p{font-size:21.5px;line-height:1.45;color:var(--ink2)}
.kp p b{color:var(--ink);font-weight:650}
.intro{font-size:19.5px;line-height:1.45;color:var(--ink2);margin-bottom:16px}
/* ---------- JD-R diagram ---------- */
.jdr{flex:1;min-height:0;display:grid;grid-template-columns:62px 1fr 62px;gap:18px;margin-bottom:10px}
.jdr .side{background:var(--panel);border-radius:4px;display:flex;align-items:center;justify-content:center;writing-mode:vertical-rl;text-align:center;padding:14px 0;gap:6px}
.jdr .side.l{transform:rotate(180deg)}
.jdr .side b{font:650 19px/1.2 var(--sans);color:var(--ink)}
.jdr .side span{font-size:15px;line-height:1.3;color:var(--ink2)}
.jdr .mid{display:flex;flex-direction:column;align-items:stretch}
.jdr .pol{background:var(--slate);color:#fff;text-align:center;font:650 19px/1 var(--sans);padding:12px;border-radius:4px}
.jdr .down{height:28px;display:flex;justify-content:center;align-items:center}
.jdr .down svg{width:26px;height:22px}
.jdr .trio{display:grid;grid-template-columns:1fr 1fr .62fr;gap:16px}
.jdr .bx{border-radius:4px;padding:16px 20px 18px}
.jdr .bx h2{font:650 21px/1.2 var(--sans);margin:0 0 10px}
.jdr .bx ul{margin:0;padding:0;list-style:none}
.jdr .bx li{position:relative;padding-left:16px;font-size:17px;line-height:1.35;margin-bottom:6px;color:var(--ink)}
.jdr .bx li::before{content:"";position:absolute;left:1px;top:.55em;width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.55}
.jdr .bx.d{background:var(--rust-t)} .jdr .bx.d h2{color:var(--rust-d)}
.jdr .bx.r{background:var(--tint)} .jdr .bx.r h2{color:var(--accent-d)}
.jdr .bx.p{background:var(--gold-t)} .jdr .bx.p h2{color:#6B5114}
.jdr .out{background:var(--accent-d);border-radius:4px;padding:14px 16px 16px;color:#fff}
.jdr .out h2{font:650 19px/1 var(--sans);text-align:center;margin:0 0 12px;color:#fff}
.jdr .four{display:grid;grid-template-columns:1fr 1fr 1fr 30px 1fr;gap:12px;align-items:stretch}
.jdr .ob{background:#fff;border-radius:3px;padding:11px 14px;color:var(--ink)}
.jdr .ob b{display:block;font:650 17px/1.2 var(--sans);margin-bottom:4px}
.jdr .ob span{font-size:15.5px;line-height:1.35;color:var(--ink2)}
.jdr .four svg{align-self:center;width:30px;height:22px}
/* ---------- timeline ---------- */
.tl{position:relative;display:grid;gap:0;margin:4px 0 0}
.tl .ev{display:grid;grid-template-columns:150px 30px 1fr;gap:18px;align-items:start;padding:0 0 22px}
.tl .ev:last-child{padding-bottom:0}
.tl .dt{font:600 21px/1.3 var(--serif);color:var(--accent);text-align:right;padding-top:1px}
.tl .dot{width:16px;height:16px;border-radius:50%;background:var(--accent);margin:7px auto 0;box-shadow:0 0 0 5px var(--paper)}
.tl .dot.r{background:var(--rust)}
.tl .tx{font-size:21px;line-height:1.45;color:var(--ink2)}
.tl .tx b{color:var(--ink);font-weight:650}
.tl::before{content:"";position:absolute;left:183px;top:14px;bottom:14px;width:2px;background:var(--rule)}
/* activity header */
.ahead{display:flex;align-items:center;gap:28px}
.ahead .an{font:500 36px/1 var(--serif);color:var(--pink-t);padding-right:28px;border-right:1px solid var(--dark-rule)}
.ahead .am{display:inline-flex;align-items:center;gap:9px;font:500 20px/1 var(--sans);color:var(--on-dark)}
.ahead .am svg{width:22px;height:22px;color:var(--on-dark2)}
.act .qs .q:first-child{padding-top:0}
/* ---------- W10: quote ---------- */
.quote{font:italic 400 31px/1.38 var(--serif);color:var(--accent-d);margin:0 0 10px;max-width:1080px;text-wrap:pretty}
.quote+.who{font-size:18px;color:var(--ink2);margin:0 0 28px}
/* ---------- W10: dot grids for a risk claim ---------- */
.dots{display:grid;grid-template-columns:repeat(10,22px);gap:7px}
.dots i{width:22px;height:22px;border-radius:50%;background:#D9D4C8;display:block}
.dots i.on{background:var(--rust)}
/* ---------- W10: hierarchy of controls ---------- */
.hoc{display:flex;flex-direction:column;align-items:center;gap:6px}
.hoc div{height:62px;display:flex;align-items:center;justify-content:center;color:#fff;font:650 21px/1.2 var(--sans);border-radius:3px;clip-path:polygon(0 0,100% 0,96% 100%,4% 100%)}
.hoc span{font:400 16px var(--sans);opacity:.85;margin-left:10px}
/* ---------- W10: outcome ladder ---------- */
.lad{display:grid;grid-template-columns:repeat(3,1fr);gap:0;align-items:end}
.lad .st{padding:22px 26px 24px;border-radius:4px 4px 0 0;color:var(--ink)}
.lad .st h2{font:650 23px/1.25 var(--sans);margin:12px 0 8px}
.lad .st p{font-size:20px;line-height:1.45;color:var(--ink2)}
.lad .st .tag{display:inline-block;font:650 15px/1 var(--sans);padding:7px 11px;border-radius:3px;color:#fff}
/* ---------- W10 v2: title, dividers, verbatim lists, documents ---------- */
.tt{flex:1;padding:0 60px 0 96px;display:flex;flex-direction:column;justify-content:center}
.tt h1{font:500 86px/1.0 var(--serif);letter-spacing:-.026em;margin:0 0 30px;text-wrap:balance}
.tt .sub{font:italic 400 35px/1.28 var(--serif);color:var(--on-dark);margin:0 0 46px;max-width:600px;text-wrap:balance}
.tt .by{display:flex;gap:30px;align-items:center;font-size:24px;padding-top:30px;border-top:1px solid var(--dark-rule);max-width:600px}
.part .side .pn{font:500 88px/1 var(--serif);color:var(--on-dark2);margin:0 0 16px;max-width:none;font-variant-numeric:lining-nums}
.part .side h1.lg2{font-size:54px}
.big3 .card p{font-size:23px}
.part .pl{list-style:none;margin:28px 0 0;padding:0;max-width:480px}
.part .pl li{font-size:19.5px;line-height:1.35;color:var(--on-dark);padding:10px 0;border-top:1px solid var(--dark-rule)}
.part .pl li:last-child{border-bottom:1px solid var(--dark-rule)}
.ctx{font-size:var(--t-sub);line-height:1.5;color:var(--ink2);max-width:1150px;margin:-14px 0 24px;text-wrap:pretty}
.ctx b{color:var(--ink);font-weight:650}
.vb .it{display:grid;grid-template-columns:190px 1fr;gap:22px;padding:12px 0;border-top:1px solid var(--rule);align-items:baseline}
.vb .it:last-child{border-bottom:1px solid var(--rule)}
.vb .it span{font:650 16.5px/1.3 var(--sans);color:var(--accent-d)}
.vb .it p{font:400 22px/1.42 var(--serif);color:var(--ink)}
